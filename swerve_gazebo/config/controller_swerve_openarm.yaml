controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 50

    swerve_steering_controller:
      type: "position_controllers/JointGroupPositionController"

    swerve_velocity_controller:
      type: "velocity_controllers/JointGroupVelocityController"

    arm_position_controller:
      type: "position_controllers/JointGroupPositionController"

    joint_state_broadcaster:
      type: "joint_state_broadcaster/JointStateBroadcaster"


swerve_steering_controller:
  ros__parameters:
    joints:
      - front_left_steer_joint
      - front_right_steer_joint
      - rear_left_steer_joint
      - rear_right_steer_joint


swerve_velocity_controller:
  ros__parameters:
    joints:
      - front_left_wheel_joint
      - front_right_wheel_joint
      - rear_left_wheel_joint
      - rear_right_wheel_joint


arm_position_controller:
  ros__parameters:
    joints:
      - right_link1_joint
      - right_link2_joint
      - right_link3_joint
      - right_link4_joint
      - right_link5_joint
      - right_link6_joint
      - right_link7_joint
      - left_link1_joint
      - left_link2_joint
      - left_link3_joint
      - left_link4_joint
      - left_link5_joint
      - left_link6_joint
      - left_link7_joint